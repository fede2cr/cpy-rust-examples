name: build

# Tags starting with v also publish; see the release job at the bottom.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # The natmod build needs a CircuitPython tree only as a toolchain, but stock
  # upstream cannot link a working Xtensa .mpy from Rust's output. This fork
  # carries the two mpy_ld.py fixes; see "Why a fork" in the README.
  CIRCUITPYTHON_REPO: fede2cr/circuitpython
  # A branch would track new fixes automatically; a SHA is what makes an old tag
  # still build the same bytes years later. Bump it deliberately.
  CIRCUITPYTHON_REF: 26f6c63e0de631497f135e405a71a847f328de04

jobs:
  build:
    # A native .mpy is per architecture, not per board, so the matrix is over
    # architectures. Only mandelbrot-rust builds for both: the other Makefiles
    # pin themselves to the ESP32-S3 cross compiler with `override CROSS`.
    name: ${{ matrix.module }} (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: hello
            crate: rust-module-demo
            arch: xtensawin
          - module: adafruit_ticks
            crate: adafruit-bundle-modules-rust/adafruit_ticks
            arch: xtensawin
          - module: adafruit_debouncer
            crate: adafruit-bundle-modules-rust/adafruit_debouncer
            arch: xtensawin
          - module: pixels_rs
            crate: mandelbrot-rust
            arch: xtensawin
            test_features: --features std
          - module: pixels_rs
            crate: mandelbrot-rust
            arch: armv7emsp
            test_features: --features std

    steps:
      - uses: actions/checkout@v7

      - name: Check out CircuitPython
        uses: actions/checkout@v7
        with:
          repository: ${{ env.CIRCUITPYTHON_REPO }}
          ref: ${{ env.CIRCUITPYTHON_REF }}
          path: circuitpython
          # py/ and tools/ are all the natmod build reads, and neither is a
          # submodule, so the ports' submodules can stay unfetched.
          submodules: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the mpy_ld dependencies
        # pyelftools reads the objects; `ar` reads the .a archives, and is only
        # needed by modules that set LINK_RUNTIME, which is easy to miss.
        run: pip install pyelftools ar

      - name: Cache the Xtensa toolchains
        if: matrix.arch == 'xtensawin'
        id: esp-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup/toolchains/esp
            ~/.espressif
            ~/export-esp.sh
          key: espup-esp32s3-${{ runner.os }}-v1

      - name: Install espup and the esp toolchain
        if: matrix.arch == 'xtensawin' && steps.esp-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/espup \
            https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-unknown-linux-gnu
          chmod +x /tmp/espup
          # Installs both halves: the Xtensa Rust fork (as toolchain `esp`) and
          # the xtensa-esp32s3-elf GCC the .mpy link step needs.
          /tmp/espup install --targets esp32s3 --export-file "$HOME/export-esp.sh"

      - name: Install the Arm toolchains
        if: matrix.arch == 'armv7emsp'
        run: |
          sudo apt-get update
          # Supplies arm-none-eabi-gcc and, through its dependencies, the ar the
          # Makefile uses to unpack the Rust staticlib.
          sudo apt-get install -y gcc-arm-none-eabi
          # rust-src is what -Zbuild-std compiles core from. The target itself is
          # built into rustc, so it needs no `rustup target add`.
          rustup toolchain install nightly --component rust-src --profile minimal

      - name: Report the toolchain
        run: |
          if [ "${{ matrix.arch }}" = xtensawin ]; then
            . "$HOME/export-esp.sh"
            cargo +esp --version
            xtensa-esp32s3-elf-gcc --version | head -1
          else
            cargo +nightly --version
            arm-none-eabi-gcc --version | head -1
          fi

      - name: Test
        # Ordinary host tests, so once per module is enough. The second
        # architecture would only run the same three tests again.
        if: matrix.arch == 'xtensawin'
        run: |
          . "$HOME/export-esp.sh"
          # --lib skips the doctest pass, which would build the no_std lib with
          # unwinding panics.
          cd "${{ matrix.crate }}" && cargo +esp test --lib ${{ matrix.test_features }}

      - name: Build ${{ matrix.module }}.mpy
        run: |
          # Only present on the Xtensa jobs; the Arm ones use the default rustup.
          # An `&&` here would fail the step under `bash -e` when the file is absent.
          if [ -f "$HOME/export-esp.sh" ]; then . "$HOME/export-esp.sh"; fi
          make -C "${{ matrix.crate }}/natmod" \
            ARCH="${{ matrix.arch }}" \
            MPY_DIR="$GITHUB_WORKSPACE/circuitpython" \
            PYTHON="$(which python)"

      - uses: actions/upload-artifact@v7
        with:
          # The file has to stay named <module>.mpy for the import to find it,
          # so the architecture goes in the artifact name instead.
          name: ${{ matrix.module }}-${{ matrix.arch }}
          path: ${{ matrix.crate }}/natmod/${{ matrix.module }}.mpy
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          # Not merged: both architectures produce a pixels_rs.mpy, and merging
          # would silently leave only one of them.
          merge-multiple: false

      - name: Group the modules by architecture
        run: |
          set -eu
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            # Artifact names are <module>-<arch>, and module names use
            # underscores, so the last dash is the split point.
            arch=${name##*-}
            mkdir -p "release/$arch"
            cp "$dir"/*.mpy "release/$arch/"
          done
          for dir in release/*/; do
            arch=$(basename "$dir")
            (cd release && zip -r "../mpy-$arch.zip" "$arch")
          done
          ls -lR release
          ls -l ./*.zip

      - name: Note which firmware these load on
        run: |
          cat > NOTES.md <<'EOF'
          Native `.mpy` modules, one archive per architecture.

          | Archive | Architecture | Boards |
          | --- | --- | --- |
          | `mpy-xtensawin.zip` | `xtensawin` | QT Py ESP32-S3, other ESP32-S3 boards |
          | `mpy-armv7emsp.zip` | `armv7emsp` | Metro M7 1011, Metro M4 Express, muzi Base Duo (nRF52840) |

          A native `.mpy` is specific to an architecture and to the .mpy format
          version. It will not load on another chip family, and the firmware has
          to be built with `CIRCUITPY_ENABLE_MPY_NATIVE=1`, which is off by
          default on every port.

          Unzip and copy the `.mpy` to the CIRCUITPY drive, at the top level or
          in `lib/`, keeping the filename as it is.

          Only `pixels_rs` is published for both architectures; the others are
          ESP32-S3 only.
          EOF

      - uses: softprops/action-gh-release@v3
        with:
          files: ./*.zip
          body_path: NOTES.md
          generate_release_notes: true
